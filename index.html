<!DOCTYPE Html>
<html>
<head>
<meta charset ="UTF-8">

<title> Archis Mark up</title>
<link rel="stylesheet" href="style.css">

<body>
<header>
    <div class="navbar">

        <img src="./assets/logo.png" alt="logo">
    </div>
    <div class="menulist">
        <div>Features</div>
        <div>Solutions</div>
        <div>Company</div>
        <div>Resources</div>
        <div>Contact</div>
    </div>
    <div class="lgn">

        <button class="btnlg2">Sign up</button>
    </div>
</div>
</header>
<main>
    <section class="hero">
        <div class="heroimg">
            <img src="./assets/Hero 5.png" alt="heroimg">
        </div>
        <div class="herotextsec">
            <h1>Find High Potential Cusomer With Trustco.</h1>
            <p>We provide sales teams and professionals with the knowledge, skill and discipline they need to be 10x more successful.</p>
            <div class="herobtnsec">
                <button class="herobtn1">Get Started</button>
                <a class="herobtn2">
                    <img src="./assets/Play.png" alt="play"/>
                    Check Our Video
                </a>
                
            </div>
        </div>
        <div class="heroimg">
            <img src="./assets/Hero 5.png" alt="heroimg">
        </div>
    </section>
</main>
<footer></footer>
